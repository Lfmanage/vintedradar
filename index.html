<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>VintedRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --primary:#1F9D82;--primary-pressed:#17826C;--primary-soft:#E6F6F1;
  --badge-bg:#CDEFE3;--badge-text:#0F6E5A;
  --text:#111418;--text-2:#6B7280;--text-3:#9CA3AF;
  --bg:#FFFFFF;--surface:#F4F5F7;--sep:#ECEEF1;--border:#E3E6EA;--danger:#E5484D;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{height:100%;max-width:480px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
@media (min-width:560px){html,body{background:#EEF0F2}#app{border-left:1px solid var(--sep);border-right:1px solid var(--sep)}}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg{display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.hide{visibility:hidden}

/* Écrans */
.screen{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.in-fwd{animation:inF .22s cubic-bezier(.2,.8,.2,1)}
.in-back{animation:inB .22s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{opacity:0;transform:translateX(24px)}}
@keyframes inB{from{opacity:0;transform:translateX(-24px)}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;z-index:1}
.topbar{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--text)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{background:var(--surface)}
.text-btn{height:44px;padding:0 12px;font-size:15px;font-weight:500;border-radius:12px}
.text-btn:active{background:var(--surface)}
.head3{flex:none;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:6px 4px 12px;min-height:66px}
.head3 .ttl{text-align:center;min-width:0}
.ttl h2{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl h2.sm{font-size:17px;font-weight:600}
.ttl p{font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filter-btn{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;position:relative;justify-self:center}
.filter-btn svg{width:20px;height:20px}
.filter-btn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 2px var(--surface)}
.footer{flex:none;padding:10px 20px 16px;background:var(--bg);position:relative;z-index:2}
.page-title{font-size:28px;font-weight:700;letter-spacing:-.02em;padding:2px 20px 18px}

/* Boutons */
.btn{height:52px;width:100%;border-radius:12px;background:var(--primary);color:#fff;font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(31,157,130,.2);transition:transform .12s ease,background .12s ease,opacity .15s ease}
.btn svg{width:19px;height:19px}
.btn:active{transform:scale(.98);background:var(--primary-pressed)}
.btn:disabled{opacity:.4;box-shadow:none;cursor:default;transform:none;background:var(--primary)}
.btn-2{height:46px;padding:0 20px;border-radius:12px;background:var(--surface);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn-2:active{transform:scale(.98)}

/* Accueil */
.home-inner{padding:0 20px 150px;text-align:center}
.logo{margin-top:clamp(24px,9vh,92px);font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.logo span{color:var(--primary)}
.tagline{margin-top:10px;font-size:14px;color:var(--text-2)}
.field{margin-top:44px;display:flex;align-items:center;gap:10px;height:52px;padding:0 6px 0 16px;border:1px solid var(--border);border-radius:12px;background:#fff;text-align:left;transition:border-color .15s,box-shadow .15s;cursor:text}
.field:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.field>svg{width:20px;height:20px;flex:none}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:15px}
.field input::placeholder{color:#3A3F45}
.clear{width:36px;height:36px;display:grid;place-items:center;color:var(--text-2);border-radius:10px;flex:none}
.clear svg{width:18px;height:18px}
.field-err{height:24px;padding-top:6px;font-size:13px;color:var(--danger);text-align:left}
.sub-link{margin-top:18px;font-size:14px;color:var(--text-2);padding:8px 10px;border-radius:10px;text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
.sub-link:active{background:var(--surface)}
.features{margin-top:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feat svg{width:28px;height:28px;margin:0 auto 12px}
.feat span{display:block;font-size:13px;line-height:1.35}
.wave{position:absolute;left:0;right:0;bottom:64px;width:100%;height:120px;z-index:0;pointer-events:none}

/* Barre d'onglets */
.tabbar{flex:none;height:64px;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--sep);background:var(--bg);position:relative;z-index:2}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8A9099;font-size:11px;font-weight:500;text-align:center}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--primary)}

/* Chips */
.chips{flex:none;display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:500;border:1.5px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s}
.chip.on{background:var(--primary-soft);border-color:var(--primary)}
.chip .c{color:var(--text-2);margin-left:2px}

/* Lignes d'annonces */
.list{padding-bottom:24px}
.row{display:flex;gap:16px;padding:12px 20px;position:relative;cursor:pointer;align-items:flex-start}
.row:active{background:#FAFAFB}
.row+.row::before,.offer+.offer::before,.h-row+.h-row::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:var(--sep)}
.thumb{flex:none;width:100px;height:100px;border-radius:12px;background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--text-3)}
.thumb svg{width:80%;height:80%}
.thumb>svg[stroke]{width:28px;height:28px}
.thumb img,.hero img,.thumbs .t img{width:100%;height:100%;object-fit:cover}
.row-body{flex:1;min-width:0;padding-top:6px}
.r-title{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:30px}
.r-price{font-size:18px;font-weight:700;margin-top:5px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.r-meta{font-size:13px;color:var(--text-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-meta.light{color:var(--text-3)}
.heart{position:absolute;top:10px;right:12px;width:40px;height:40px;display:grid;place-items:center;color:var(--text);border-radius:12px}
.heart svg,.heart-top svg{width:21px;height:21px;transition:fill .15s,stroke .15s}
.heart.on svg,.heart-top.on svg{fill:var(--primary);stroke:var(--primary)}
.pop svg{animation:pop .32s ease-out}
@keyframes pop{45%{transform:scale(1.28)}}
.badge{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;background:var(--badge-bg);color:var(--badge-text);font-size:13px;font-weight:600;white-space:nowrap}
.badge.sm{height:22px;padding:0 8px;font-size:12px}
.badge.opp{background:transparent;box-shadow:inset 0 0 0 1.5px var(--primary);color:var(--badge-text)}

/* Détail d'un groupe */
.g-head{text-align:center;padding:0 24px 16px}
.g-head h1{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.g-head p{font-size:13px;color:var(--text-2);margin-top:4px}
.hero{margin:0 20px;aspect-ratio:6/5;border-radius:16px;background:var(--surface);overflow:hidden;display:grid;place-items:center;color:var(--text-3)}
.hero svg{width:74%;height:74%}
.hero>svg[stroke]{width:40px;height:40px}
.thumbs{position:relative;display:flex;gap:10px;overflow-x:auto;padding:14px 20px 6px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumbs .t{flex:none;width:72px;height:66px;border-radius:12px;background:var(--surface);overflow:hidden;display:grid;place-items:center;border:2px solid transparent;transition:border-color .15s}
.thumbs .t.on{border-color:var(--primary)}
.thumbs .t svg{width:72%;height:72%}
.pricebox{margin:14px 20px 4px;padding:16px 16px 14px;border-radius:16px;background:var(--surface)}
.pb-nums{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.pb-nums b{display:block;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pb-nums span{display:block;font-size:12px;color:var(--text-2);margin-top:2px}
.pb-bar{position:relative;height:4px;border-radius:4px;background:#DFE2E6;margin:16px 8px 0}
.pb-avg{position:absolute;top:-4px;width:2px;height:12px;border-radius:2px;background:#A7ADB4;transform:translateX(-1px)}
.pb-dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--primary);border:2.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transform:translate(-50%,-50%)}
.pb-cap{margin-top:14px;font-size:13px;color:var(--text-2);text-align:center;line-height:1.45}
.pb-cap b{color:var(--text);font-weight:600}
.pb-cap.opp{color:var(--badge-text)}
.pb-cap.opp b{color:var(--badge-text)}
.offers{margin-top:6px}
.offer{display:flex;align-items:center;gap:10px;padding:12px 20px;position:relative;cursor:pointer;min-height:58px}
.offer:active{background:#FAFAFB}
.offer.sel{background:#F7FBFA}
.o-left{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.o-price{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.o-seller{width:116px;flex:none;display:flex;flex-direction:column;min-width:0}
.o-seller b{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-seller small{font-size:12px;color:var(--text-3);margin-top:2px;white-space:nowrap}
.offer>svg{width:18px;height:18px;flex:none;color:var(--text-2)}
.link-row{display:flex;align-items:center;justify-content:space-between;width:calc(100% - 40px);margin:4px 20px 0;min-height:50px;border-top:1px solid var(--sep);font-size:15px;font-weight:500}
.link-row span{display:flex;align-items:center;gap:4px;color:var(--text-2);font-weight:400}
.link-row svg{width:18px;height:18px}
.note{padding:10px 20px 24px;font-size:12px;color:var(--text-3);line-height:1.5}

/* Recherche en attente */
.filt-cap{padding:0 20px 8px;font-size:13px;color:var(--text-3)}
.filt{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.filt span{height:32px;display:inline-flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--surface);font-size:13px;color:var(--text)}

/* Filtres et réglages */
.f-block{padding:0 20px 14px}
.f-label{display:block;font-size:15px;font-weight:500;margin-bottom:10px}
.price-row{display:flex;align-items:center;gap:12px}
.price-row span{color:var(--text-2)}
.inp{flex:1;min-width:0;height:48px;border-radius:12px;background:var(--surface);border:1.5px solid transparent;padding:0 14px;font-size:15px;outline:0;transition:border-color .15s,background .15s}
.inp:focus{border-color:var(--primary);background:#fff}
.inp::placeholder{color:var(--text-3)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;margin:0 20px;width:calc(100% - 40px);border-bottom:1px solid var(--sep);text-align:left;font-size:16px;font-weight:500}
.set-row .val{display:flex;align-items:center;gap:4px;color:var(--text-2);font-size:15px;font-weight:400;white-space:nowrap;max-width:60%;overflow:hidden}
.set-row .val svg{width:18px;height:18px;flex:none}
.set-row.sw>span{display:flex;flex-direction:column}
.set-row.sw small{font-size:13px;color:var(--text-2);margin-top:2px;font-weight:400}
.set-row.danger{color:var(--danger);font-size:15px}
.switch{flex:none;width:51px;height:31px;border-radius:999px;background:#E3E6EA;position:relative;transition:background .2s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.16);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--primary)}
.switch.on::after{transform:translateX(20px)}
.switch:disabled{opacity:.4;cursor:default}
.pick-row{display:flex;align-items:center;gap:10px;min-height:54px;margin:0 20px;width:calc(100% - 40px);border-bottom:1px solid var(--sep);font-size:16px;text-align:left}
.pick-row .n{margin-left:auto;font-size:13px;color:var(--text-3)}
.pick-row svg{width:20px;height:20px;color:var(--primary);flex:none}
.pick-row .ph{width:20px;flex:none}
.pick-row:disabled{color:var(--text-3);cursor:default}
.sec{font-size:13px;font-weight:600;color:var(--text-2);padding:6px 20px 4px}
.about{padding:32px 20px;text-align:center;font-size:12px;color:var(--text-3);line-height:1.6}

/* Recherches */
.h-row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 20px;text-align:left;position:relative}
.h-row:active{background:#FAFAFB}
.h-ic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.h-ic svg{width:20px;height:20px}
.h-body{flex:1;min-width:0;display:flex;flex-direction:column}
.h-body b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-body small{font-size:13px;color:var(--text-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-date{font-size:12px;color:var(--text-3);white-space:nowrap}
.h-row>svg{width:18px;height:18px;color:var(--text-3);flex:none}

/* États vides, message */
.empty{text-align:center;padding:48px 32px}
.empty .ic{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:0 auto 16px}
.empty .ic svg{width:24px;height:24px;color:var(--text-2)}
.empty h3{font-size:17px;font-weight:600}
.empty p{font-size:14px;color:var(--text-2);margin-top:6px;line-height:1.5}
.empty .acts{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);opacity:0;pointer-events:none;background:#1B1E22;color:#fff;font-size:14px;font-weight:500;padding:11px 16px;border-radius:12px;max-width:min(88vw,420px);text-align:center;transition:opacity .2s,transform .2s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
'use strict';

/* ---------- Outils ---------- */
const app = document.getElementById('app');
const $ = (s) => app.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('vr2:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('vr2:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const fmtPrix = (n) => (n == null || !isFinite(n)) ? 'Prix indisponible' : new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(n);
function ilYa(iso) {
  if (!iso) return '';
  const m = (Date.now() - new Date(iso).getTime()) / 60000;
  if (m < 1) return "À l'instant";
  if (m < 60) return 'Il y a ' + Math.floor(m) + ' min';
  if (m < 1440) return 'Il y a ' + Math.floor(m / 60) + ' h';
  if (m < 2880) return 'Hier';
  return 'Il y a ' + Math.floor(m / 1440) + ' j';
}
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ---------- Icônes (style Lucide) ---------- */
const sv = (p) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
const HEART = '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>';
const HOUSE = 'M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z';
const I = {
  back: sv('<path d="m15 18-6-6 6-6"/>'),
  chevR: sv('<path d="m9 18 6-6-6-6"/>'),
  x: sv('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
  arrow: sv('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>'),
  ext: sv('<path d="M7 7h10v10"/><path d="M7 17 17 7"/>'),
  link: sv('<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'),
  heart: sv(HEART),
  heartF: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">' + HEART + '</svg>',
  home: sv('<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="' + HOUSE + '"/>'),
  homeF: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + HOUSE + '" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><rect x="10" y="13.5" width="4" height="8" rx="1" fill="#fff"/></svg>',

function dessin(cat, couleur) {
  const c = TEINTES[couleur] || TEINTES.gris;
  const clair = couleur === 'blanc' || couleur === 'beige' || couleur === 'gris';
  const s = clair ? 'rgba(0,0,0,.13)' : 'rgba(255,255,255,.2)';
  const o = couleur === 'blanc' ? '#D3D6DA' : 'none';
  return '<svg viewBox="0 0 100 100" aria-hidden="true">' + (FORMES[cat] || FORMES.Sweats)(c, s, o) + '</svg>';
}
function visuel(it) {
  if (it.fictive) return dessin(it.fictive.cat, it.fictive.couleur);
  if (it.photo) return '<img src="' + esc(it.photo) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">';
  return I.image;
}

const S = {

const cur = () => S.stack[S.stack.length - 1];

/* ---------- Navigation ---------- */
try { history.replaceState({ n: 0 }, ''); S.useHist = true; } catch (e) { S.useHist = false; }
function push(scr) {
  S.stack.push(scr);
  if (S.useHist) { try { history.pushState({ n: S.stack.length }, ''); } catch (e) { S.useHist = false; } }
  render('fwd');
}
function back() {
  if (!S.stack.length) return;
  const n = S.stack.length;
  if (S.useHist) {
    history.back();
    setTimeout(() => { if (S.stack.length === n) { S.stack.pop(); render('back'); } }, 400);
  } else { S.stack.pop(); render('back'); }
}
window.addEventListener('popstate', (e) => {
  const n = e.state && typeof e.state.n === 'number' ? e.state.n : 0;
  if (n < S.stack.length) { S.stack.length = n; render('back'); }
});
function cleEcran() { const t = cur(); return t ? t.name + (t.gid || '') + (t.eq || '') + (t.field || '') + (t.id || '') : 'tab-' + S.tab; }
function render(dir) {
  const old = $('.scroll');
  if (old && S.curKey) S.scrolls[S.curKey] = old.scrollTop;
  const t = cur();
  app.innerHTML = t ? VUES[t.name](t) : VUES[S.tab]();
  const key = cleEcran();
  const scr = app.firstElementChild;
  if (dir && scr) scr.classList.add(dir === 'fwd' ? 'in-fwd' : 'in-back');
  const sc = $('.scroll');
  if (sc) {
    if (S.topNext) { sc.scrollTop = 0; S.topNext = false; }
    else if (dir !== 'fwd' && S.scrolls[key] != null) sc.scrollTop = S.scrolls[key];
  }
  const tOn = app.querySelector('.thumbs .t.on');
  if (tOn) {
    const box = tOn.parentNode;
    if (tOn.offsetLeft + tOn.offsetWidth > box.scrollLeft + box.clientWidth || tOn.offsetLeft < box.scrollLeft) box.scrollLeft = tOn.offsetLeft - 20;
  }
  S.curKey = key;
}

function ligne(it, opts) {

function blocPrix(g, sel) {
  const st = g.stats;
  if (!st || g.items.length < 2) return '';
  const span = st.max - st.min;
  const pos = (v) => span > 0 ? ((v - st.min) / span) * 100 : 50;
  let cap;
  if (sel._opp) {
    cap = '<p class="pb-cap opp">Prix inférieur aux annonces comparables : <b>' + fmtPrix(sel._p) + '</b> contre ' + fmtPrix(Math.round(sel._opp.med)) + ' en médiane sur ' + sel._opp.n + ' autres annonces.</p>';
  } else if (!isFinite(sel._p)) {
    cap = '<p class="pb-cap">Prix de cette annonce indisponible.</p>';
  } else if (sel._p === st.min) {
    cap = '<p class="pb-cap">Cette annonce : <b>' + fmtPrix(sel._p) + '</b>, la moins chère du groupe.</p>';
  } else {
    const d = Math.round((sel._p / st.moy - 1) * 100);
    cap = '<p class="pb-cap">Cette annonce : <b>' + fmtPrix(sel._p) + '</b>, ' + (d === 0 ? 'dans la moyenne.' : Math.abs(d) + ' % ' + (d < 0 ? 'sous' : 'au-dessus de') + ' la moyenne.') + '</p>';
  }
  return '<div class="pricebox">' +
    '<div class="pb-nums"><div><b>' + fmtPrix(st.min) + '</b><span>Moins cher</span></div><div><b>' + fmtPrix(Math.round(st.moy)) + '</b><span>Moyenne</span></div><div><b>' + fmtPrix(st.max) + '</b><span>Plus cher</span></div></div>' +
    '<div class="pb-bar" aria-hidden="true"><i class="pb-avg" style="left:' + pos(st.moy).toFixed(1) + '%"></i>' + (isFinite(sel._p) ? '<i class="pb-dot" style="left:' + pos(sel._p).toFixed(1) + '%"></i>' : '') + '</div>' +
    cap + '</div>';
}

    let opts;
    if (field === 'tri') {
      opts = Object.keys(TRI).map((v) => ({ v, l: TRI[v], off: v === 'recent' && !dates, n: v === 'recent' && !dates ? 'Date indisponible' : v === 'pert' ? 'Ordre Vinted' : '' }));
    } else {
      const cnt = new Map();
      for (const it of S.data.items) { const v = it[CLE_CHAMP[field]]; if (v) cnt.set(v, (cnt.get(v) || 0) + 1); }
      const ORDRE = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL'];
      const rang = (v) => { const i = ORDRE.indexOf(v); return i >= 0 ? i : (/^\d+$/.test(v) ? 100 + +v : 1000); };
      const entries = [...cnt.entries()].sort(field === 'taille' ? (a, b) => rang(a[0]) - rang(b[0]) || b[1] - a[1] : (a, b) => b[1] - a[1] || String(a[0]).localeCompare(b[0]));
      opts = [{ v: null, l: DEF_LABEL[field] }].concat(entries.map(([v, n]) => ({ v, l: field === 'vendeur' ? '@' + v : v, n })));
    }
    return '<section class="screen">' + head3(backBtn, '<h2 class="sm">' + TITRE_CHAMP[field] + '</h2>', '<span></span>') +
      '<div class="scroll">' + opts.map((o) => {
        const on = (o.v === null ? courant == null : courant === o.v);
        return '<button class="pick-row" data-a="pick-val" data-v="' + esc(o.v === null ? '' : o.v) + '" data-null="' + (o.v === null) + '"' + (o.off ? ' disabled' : '') + '>' + (on ? I.check : '<span class="ph"></span>') + '<span>' + esc(o.l) + '</span>' + (o.n ? '<span class="n">' + esc(o.n) + '</span>' : '') + '</button>';
      }).join('') + '</div></section>';
  },

  searches() {
    const h = S.histo;
    const lignes = h.map((e) => '<button class="h-row" data-a="hist-open" data-id="' + esc(e.id) + '"><span class="h-ic">' + I.search + '</span>' +
      '<span class="h-body"><b>' + esc(e.query) + '</b><small>En attente de capture' + (e.filtres.length ? ' • ' + e.filtres.length + ' filtre' + (e.filtres.length > 1 ? 's' : '') : '') + '</small></span>' +
      '<span class="h-date">' + ilYa(e.date) + '</span>' + I.chevR + '</button>').join('');
    return '<section class="screen">' +
      '<div class="topbar"><span></span>' + (h.length ? '<button class="text-btn" data-a="hist-clear">Effacer</button>' : '') + '</div>' +
      '<div class="scroll"><h1 class="page-title">Recherches</h1>' +
      (h.length ? lignes : vide(I.search, 'Aucune recherche pour l’instant', 'Colle un lien de recherche Vinted depuis l’accueil : il apparaîtra ici.', '<button class="btn-2" data-a="tab" data-tab="home">Coller un lien</button>')) +
      '</div>' + tabbar('searches') + '</section>';
  },

  favorites() {
    const favs = Object.values(S.favs).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
    return '<section class="screen">' +
      '<div class="topbar"></div>' +
      '<div class="scroll"><h1 class="page-title">Favoris</h1>' +
      (favs.length ? '<div class="list">' + favs.map((i) => ligne(i, { tap: 'link', tag: true })).join('') + '</div>' : vide(I.heart, 'Aucun favori', 'Touche le cœur d’une annonce pour la garder ici, avec son lien Vinted.')) +
      '</div>' + tabbar('favorites') + '</section>';
  },

  settings() {
    return '<section class="screen">' + head3(backBtn, '<h2 class="sm">Réglages</h2>', '<span></span>') +
      '<div class="scroll">' +
        '<p class="sec">Données enregistrées sur cet appareil</p>' +
        '<button class="set-row danger" data-a="confirm" data-do="histo">Effacer l’historique des recherches</button>' +
        '<button class="set-row danger" data-a="confirm" data-do="favs">Effacer les favoris</button>' +
        '<p class="about">VintedRadar · usage personnel<br>Aucun mot de passe Vinted n’est demandé ni enregistré.<br>Chaque annonce s’ouvre sur Vinted.</p>' +
      '</div></section>';
  },
};

/* ---------- Actions principales ---------- */
function ouvrirAnalyse(a) { S.analysis = a; S.data = derive(a); S.filters = defaultFilters(); S.chip = 'tous'; S.scrolls = {}; }
function sauverHisto() { store.set('histo', S.histo); }
function analyser() {
  const p = lireLien(S.link);
  if (!p.ok) { majLien(true); return; }
  let e = S.histo.find((x) => x.url === p.url);
  if (e) { e.date = new Date().toISOString(); S.histo = [e].concat(S.histo.filter((x) => x !== e)); }
  else { e = { id: 'r' + Date.now(), url: p.url, query: p.query, filtres: p.filtres, date: new Date().toISOString(), statut: 'attente' }; S.histo = [e].concat(S.histo).slice(0, 30); }
  sauverHisto();
  push({ name: 'pending', id: e.id });
}
function toggleFav(id) {
  const it = (S.data && S.data.byId.get(id)) || S.favs[id];
  if (!it) return;
  const on = !S.favs[id];
  if (on) S.favs[id] = { id, titre: it.titre, prix: it.prix, prix_total: it.prix_total, marque: it.marque, taille_etat: it.taille_etat, photo: it.photo, vendeur: it.vendeur, lien: it.lien, date_photo: it.date_photo, fictive: it.fictive, savedAt: Date.now() };
  else delete S.favs[id];
  store.set('favs', S.favs);
  if (!cur() && S.tab === 'favorites') { render(); return; }
  app.querySelectorAll('[data-a="fav"]').forEach((b) => {
    if (b.dataset.id !== id) return;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', String(on));
    b.setAttribute('aria-label', on ? 'Retirer des favoris' : 'Ajouter aux favoris');
    b.classList.remove('pop');
    if (on) { void b.offsetWidth; b.classList.add('pop'); }
  });
}
function majLien(forcer) {
  const p = lireLien(S.link);
  const go = $('#go'), err = $('#link-err'), clr = $('.clear');
  if (go) go.disabled = !p.ok;
  if (err) err.textContent = (S.link.trim() || forcer) && !p.ok ? (p.msg || 'Colle un lien de recherche vinted.fr.') : '';
  if (clr) clr.classList.toggle('hide', !S.link);
}
function confirmer(el, fn) {
  if (el.dataset.armed === '1') { clearTimeout(el._t); el.dataset.armed = ''; fn(); return; }
  el.dataset.armed = '1'; el.dataset.label = el.textContent;
  el.textContent = 'Touche à nouveau pour confirmer';
  el._t = setTimeout(() => { el.dataset.armed = ''; if (el.isConnected && !el.disabled) el.textContent = el.dataset.label; }, 3000);
}
const ACTIONS = {
  tab(el) { S.tab = el.dataset.tab; S.stack = []; render(); },
  settings() { push({ name: 'settings' }); },
  back() { back(); },
  'clear-link'(el, e) { e.preventDefault(); S.link = ''; const i = $('#link'); if (i) { i.value = ''; i.focus(); } majLien(); },
  analyze() { analyser(); },
  apercu() { ouvrirAnalyse({ id: 'apercu', query: 'Nike', apercu: true, raw: genererApercu() }); push({ name: 'results' }); },
  chip(el) { S.chip = el.dataset.chip; S.topNext = true; render(); },
  'open-group'(el) { const it = S.data.byId.get(el.dataset.id); if (it) push({ name: 'group', gid: it._sim, sel: it.id }); },
  'select-in-group'(el) {
    const below = S.stack[S.stack.length - 2], it = S.data.byId.get(el.dataset.id);
    if (below && below.name === 'group' && it && below.gid === it._sim) { below.sel = it.id; back(); }
    else if (it) push({ name: 'group', gid: it._sim, sel: it.id });
  },
  thumb(el) { cur().sel = el.dataset.id; render(); },
  'open-link'(el) { const u = el.dataset.url; if (u) window.open(u, '_blank', 'noopener'); else toast('Annonce fictive : aucun lien Vinted.'); },
  'see-all'(el) { push({ name: 'results', gid: el.dataset.gid }); },
  'see-eq'(el) { push({ name: 'results', eq: el.dataset.gid }); },
  fav(el) { toggleFav(el.dataset.id); },
  filters() { push({ name: 'filters', draft: Object.assign({}, S.filters) }); },
  'reset-draft'() { Object.assign(cur().draft, defaultFilters()); render(); },
  'reset-filters'() { S.filters = defaultFilters(); S.topNext = true; render(); },
  pick(el) { push({ name: 'picker', field: el.dataset.field, draft: cur().draft }); },
  'pick-val'(el) { const t = cur(); t.draft[t.field] = el.dataset.null === 'true' ? null : el.dataset.v; back(); },
  toggle(el) { const d = cur().draft, k = el.dataset.k; d[k] = !d[k]; el.classList.toggle('on', d[k]); el.setAttribute('aria-checked', String(d[k])); },
  apply() { S.filters = Object.assign({}, cur().draft); S.scrolls.results = 0; back(); },
  'hist-open'(el) { push({ name: 'pending', id: el.dataset.id }); },
  'hist-clear'(el) { confirmer(el, () => { S.histo = []; sauverHisto(); render(); }); },
  confirm(el) {
    confirmer(el, () => {
      if (el.dataset.do === 'histo') { S.histo = []; sauverHisto(); el.textContent = 'Historique effacé'; }
      else { S.favs = {}; store.set('favs', {}); el.textContent = 'Favoris effacés'; }
      el.disabled = true;
    });
  },
};
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.a];
  if (fn) fn(el, e);
});
app.addEventListener('keydown', (e) => {
  if (e.target.id === 'link' && e.key === 'Enter') { e.preventDefault(); analyser(); return; }
  if (e.target.classList && e.target.classList.contains('inp') && e.key === 'Enter') { e.target.blur(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.dataset.a) { e.preventDefault(); e.target.click(); }
});
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'link') { S.link = t.value; majLien(); }
  else if (t.dataset.f) { const top = cur(); if (top && top.draft) top.draft[t.dataset.f] = t.value.trim(); }
});

render();
})();
</script>
